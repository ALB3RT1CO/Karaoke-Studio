server {
    listen 80;
    server_name karaoke.kaoruman.duckdns.org;

    # Optional: Redirect HTTP to HTTPS if you configure Certbot later
    # listen 443 ssl;
    # ssl_certificate /etc/letsencrypt/live/karaoke.kaoruman.duckdns.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/karaoke.kaoruman.duckdns.org/privkey.pem;

    location / {
        proxy_pass http://karaoke-app:3030;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Real IP forwarding
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
